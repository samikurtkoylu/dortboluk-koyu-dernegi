name: GitHub Pages

# Siteyi derleyip statik olarak dışa aktarır ve GitHub Pages'e yayınlar.
# Derleme çıktısı depoya işlenmez; her yayında yeniden üretilir.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # deploy-pages v4'ten beri artifact'i kimlik numarasıyla çekiyor
  actions: read

# Aynı anda tek yayın çalışsın; devam eden yayın iptal edilmesin
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Depo alt dizininde yayınlanıyorsa taban yol gerekir:
      #   https://<kullanici>.github.io/dortboluk-koyu-dernegi/
      # Özel alan adı (CNAME) kullanacaksanız bu değeri boş bırakın.
      BASE_PATH: /dortboluk-koyu-dernegi
      # Paylaşım kartlarındaki mutlak adresler bundan üretilir
      SITE_ORIGIN: https://samikurtkoylu.github.io/dortboluk-koyu-dernegi
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      # pnpm'den sonra gelmeli: cache yolunu pnpm'e sorarak buluyor
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Testler
        run: pnpm test

      - name: Statik dışa aktarım
        run: node scripts/export-static.mjs --base "$BASE_PATH"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
          # v4'ten beri nokta ile başlayan dosyalar varsayılan olarak atlanıyor;
          # export .nojekyll yazdığı için açıkça dahil ediyoruz
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
