version: 2

# pnpm 11 son 24 saat içinde yayınlanmış paketleri reddediyor
# (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION) — yeni çıkmış, henüz kimsenin
# incelemediği bir sürüm zincire girmesin diye. Dependabot en yeni sürümü
# önerdiğinde bu ikisi çakışıyor ve PR daha kurulum adımında düşüyor.
# Aşağıdaki cooldown Dependabot'u pnpm'in eşiğinin arkasında tutar.

# Workflow'lardaki action sürümlerini takip eder. Action'lar seyrek yayın
# yaptığı için aylık tarama yeterli; hepsi tek grupta toplanıyor ki her
# sürüm için ayrı ayrı PR açılmasın.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  # Paket bağımlılıkları. Minör ve yamalar tek PR'da toplanıyor; major'lar
  # ayrı ayrı geliyor ki kırıcı değişiklikler tek tek incelenebilsin.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    cooldown:
      default-days: 3
    ignore:
      # Çalışma zamanı Node 22'ye sabitli (package.json engines, CI node-version).
      # Tip paketi ileri bir major'a çıkarsa var olmayan API'leri varmış gibi
      # gösterir; runtime yükselene kadar 22.x'te kalmalı.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      npm-kucuk-surumler:
        update-types:
          - minor
          - patch
